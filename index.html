<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRM Part I Study Hub — Financial Risk Manager (2026)</title>
<meta name="description" content="Complete study hub for the GARP FRM Part I exam (2026 curriculum): notes for all 62 readings, flashcards, interactive quizzes, a full mock exam and a financial calculator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313315f'/%3E%3Cpolyline points='12,44 24,32 33,38 50,18' fill='none' stroke='%23e7c45c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolygon points='50,18 51,29 40,19' fill='%23e7c45c'/%3E%3C/svg%3E">
</head>
<body>
<!-- Top bar -->
<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Toggle menu">☰</button>
  <a class="brand" href="#/home">
    <span class="brand-badge">FRM</span>
    <span class="brand-text">Part I Study Hub<small>Financial Risk Manager · 2026</small></span>
  </a>
  <div class="topbar-spacer"></div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search everything…  (press /)" autocomplete="off">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <div class="fontctl" role="group" aria-label="Text size">
    <button id="fontDown" class="icon-btn font-btn" title="Smaller text" aria-label="Smaller text">A<small>−</small></button>
    <button id="fontUp" class="icon-btn font-btn" title="Larger text" aria-label="Larger text">A<small>+</small></button>
  </div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark">🌙</button>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="progress-box">
      <div class="progress-label"><span>Your progress</span><span id="progressPct">0%</span></div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <button id="resetProgress" class="link-btn">Reset progress</button>
    </div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <div id="overlay" class="overlay"></div>

  <!-- Main -->
  <main id="main" class="main">
    <div id="content" class="content markdown-body"></div>
    <div id="chapterNav" class="chapter-nav"></div>
    <footer class="page-footer">
      Independent study notes built from GARP's publicly available 2026 FRM Part I learning objectives.
      Not affiliated with or endorsed by GARP. FRM® is a registered trademark of the Global Association of Risk Professionals.
    </footer>
  </main>
</div>

<!-- marked.js for markdown, KaTeX for math (with graceful fallback) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script src="content.js"></script>
<script src="viz.js"></script>
<script src="app.js"></script>
</body>
</html>
